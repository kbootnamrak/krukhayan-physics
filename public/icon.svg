<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#16225a"/>
      <stop offset="1" stop-color="#070c24"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ลายวงจรจาง ๆ -->
  <g stroke="#7fe3ff" stroke-opacity=".12" stroke-width="6" fill="none" stroke-linecap="square">
    <path d="M0 96h84l36 36h60"/>
    <path d="M512 400h-84l-36-36h-60"/>
    <path d="M404 0v70l-30 30"/>
    <path d="M108 512v-70l30-30"/>
  </g>
  <g fill="#7fe3ff" fill-opacity=".18">
    <circle cx="180" cy="132" r="9"/><circle cx="332" cy="364" r="9"/>
  </g>
  <!-- อะตอม: วงโคจร 3 วง -->
  <g filter="url(#glow)" fill="none" stroke-width="18" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="172" ry="66" stroke="#ff3fb4"/>
    <ellipse cx="256" cy="256" rx="172" ry="66" stroke="#4fe3ff" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="172" ry="66" stroke="#9dff5c" transform="rotate(-60 256 256)"/>
  </g>
  <!-- อิเล็กตรอน -->
  <g filter="url(#glow)">
    <circle cx="428" cy="256" r="17" fill="#ffffff"/>
    <circle cx="170" cy="107" r="17" fill="#ffffff"/>
    <circle cx="170" cy="405" r="17" fill="#ffffff"/>
  </g>
  <!-- นิวเคลียส -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="40" fill="#ffe14d"/>
  </g>
  <circle cx="244" cy="244" r="12" fill="#fff6b8" fill-opacity=".8"/>
</svg>
